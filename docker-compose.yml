services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev-only-password   
      MYSQL_DATABASE: kursplassen              
    ports:
      - "3307:3306"
    volumes:
      - kursplassen-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
volumes:
  kursplassen-data: